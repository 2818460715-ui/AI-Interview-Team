server:
  port: 8088
  address: 0.0.0.0
spring:
  mail:
    protocol: smtp
    host: smtp.163.com
    port: 465
    username: ${USER_NAME:}
    password: ${PASS_WORD:}
    default-encoding: utf-8
    debug: true
    properties:
      mail:
        smtp:
          ssl:
            enable: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/interview}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DB:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 300ms
  ai:
    dashscope:
      enabled: true
      api-key: ${Ali_API_KEY:}
      audio:
        speech:
          api-key: ${Ali_API_KEY:}
        transcription:
          api-key: ${Ali_API_KEY:}
      chat:
        options:
          model: qwen-plus
          temperature: 0.7
          top_p: 0.8
          max-tokens: 800
feature:
  enable-free-chat: false
  enable-cohort: false
  enable-code-practice: false
practice:
  evaluation:
    provider: llm
ai:
  enable: true
  debug:
    echo-mode: false
